<section id="mekanizma">
  <div class="sec-head">
    <div class="title"><h2>Mekanizma</h2></div>
    <p>Üç çizim, sözleşmenin dayandığı üç mekanizmayı gösterir: aynı capability'ye giden üç yol ve tek yetki noktası; metadata'dan modele ve ekrana giden veri; uzun bir YZ işinin Run kaydındaki yaşam döngüsü.</p>
  </div>

      <span class="scroll-hint">Aşağıdaki çizim gerçek boyutunda kalır ve yana kaydırılır.</span>
      <ol class="fig-steps">
        <li><b>Üç giriş:</b> kullanıcının kendi eylemi (direct), kullanıcının onayladığı öneri (assisted), kullanıcının önceden verdiği sınırlı yetki içinde çalışan ajan (delegated).</li>
        <li><b>Etkileşim düzenleyici</b> modu ve risk sınıfını belirler, gerekirse diff ve onay ister.</li>
        <li><b>Yetenek istemcisi</b> aynı capability sözleşmesini Idempotency-Key ile çağırır.</li>
        <li><b>BFF kenarı</b> (aynı origin ters vekil ve kimlik köprüsü) isteği Frappe'nin HttpOnly oturum çerezi ve CSRF belirteciyle REST v2 veya RPC'ye iletir; tarayıcıda token yoktur.</li>
        <li><b>Frappe</b> izin, iş kuralı, docstatus ve job kararını verir; tek yetki noktasıdır. Hata türü yanıttaki exc_type ile ayrışır.</li>
      </ol>
      <figcaption><b>Üç giriş yolu, tek capability, tek yetki noktası.</b> Kullanıcı, model destekli kullanıcı ve ajan aynı eylem sözleşmesini kullanır. İzin, iş kuralı ve docstatus geçişi yalnızca Frappe'de karar verilir; bir düğmenin gizlenmesi veya modelin "yetkili" demesi güvenlik kontrolü değildir.</figcaption>

    <figure class="fig">
      <div class="canvas"><svg viewBox="0 0 960 300" role="img" aria-label="Run durum makinesi: queued, running, awaiting_approval, applying ve done ana yolu; running ve applying durumlarından cancel_requested ile cancelled; applying durumundan partially_done; dış yan etkide zaman aşımında outcome_unknown ve oradan needs_reconciliation; istemci Run belgesinin doc odasına izinli abonelikle bağlanır">

      <span class="scroll-hint">Aşağıdaki çizim gerçek boyutunda kalır ve yana kaydırılır.</span>
      <ol class="fig-steps">
        <li><b>queued:</b> iş Frappe job olarak kuyruğa girer, Run kaydı açılır.</li>
        <li><b>running:</b> worker Run'ı kilit ve lease ile sahiplenir; her adım günlüğe ve checkpoint'e yazılır.</li>
        <li><b>awaiting_approval:</b> yetki dışındaki adımda durur, worker serbest kalır; onay yeni job başlatır.</li>
        <li><b>applying:</b> onay ve revizyon Frappe içinde yeniden doğrulanır; her kayıt idempotent uygulanır.</li>
        <li><b>done:</b> sonuç, geri alma penceresi ve export sunulur; denetim izi yazılır.</li>
        <li><b>Yan yollar:</b> cancel_requested → cancelled; partially_done veya failed → seçmeli yeniden deneme; dış çağrının yanıtı kaybolursa outcome_unknown → needs_reconciliation.</li>
        <li><b>Abonelik:</b> istemci Run belgesinin doc odasına izin kontrollü bağlanır; task_subscribe kullanılmaz; olay yalnızca "değişti" sinyali taşır, durum ve ilerleme yüzdesi izinli REST ile okunur (karar kitabı C03). Bağlantı koparsa yoklama yedeği devreye girer (B6).</li>
      </ol>
      <figcaption><b>Run yaşam döngüsü.</b> Uzun YZ işi tarayıcı ömründen bağımsız olarak Frappe job'ında koşar ve Run DocType'ında izlenir. Frappe çekirdeği kuyruk ve transaction verir; adım günlüğü, kilit, checkpoint, uzlaştırma ve izinli abonelik Frappe custom app'te geliştirilir (E5, E10). Çöküşte Run son tamamlanan adımdan otomatik sürer; sonucu bilinmeyen ve tekrar koruması olmayan dış işlem tekrarlanmaz (karar kitabı V06).</figcaption>
